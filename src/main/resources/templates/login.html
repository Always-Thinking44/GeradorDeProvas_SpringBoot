<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login — Sistema de Geração de Provas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body.login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(13, 148, 136, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(30, 41, 59, 0.8) 0px, transparent 50%);
            padding: 20px;
            color: #0f172a;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border-radius: 14px;
            padding: 38px 32px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .login-brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-icon-wrapper {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
            color: #ffffff;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            box-shadow: 0 4px 14px rgba(13, 148, 136, 0.35);
        }

        .login-brand h1 {
            font-size: 1.35rem;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
        }

        .login-brand p {
            color: #64748b;
            font-size: 0.86rem;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 13px;
            color: #94a3b8;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-input {
            width: 100%;
            height: 44px;
            padding: 10px 14px 10px 40px;
            font-size: 0.9rem;
            color: #0f172a;
            background: #ffffff;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input::placeholder {
            color: #94a3b8;
        }

        .form-input:hover {
            border-color: #94a3b8;
        }

        .form-input:focus {
            border-color: #0d9488;
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
        }

        .error-box {
            display: none;
            align-items: center;
            gap: 9px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 0.82rem;
            line-height: 1.4;
        }

        .error-box svg {
            flex-shrink: 0;
            color: #dc2626;
        }

        .btn-submit {
            width: 100%;
            height: 44px;
            padding: 0 20px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #ffffff;
            background: #0d9488;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(13, 148, 136, 0.3);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 22px;
        }

        .btn-submit:hover {
            background: #0f766e;
            box-shadow: 0 4px 10px rgba(13, 148, 136, 0.4);
        }

        .btn-submit:active {
            background: #115e59;
        }

        .btn-submit:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .login-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 0.78rem;
            color: #94a3b8;
        }
    </style>
</head>
<body class="login-page">

<div class="login-card">
    <div class="login-brand">
        <div class="brand-icon-wrapper">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
                <polyline points="10 9 9 9 8 9"/>
            </svg>
        </div>
        <h1>Gerador de Provas</h1>
        <p>Introduza as suas credenciais para aceder</p>
    </div>

    <form id="formLogin">
        <div class="form-group">
            <label for="email">E-mail</label>
            <div class="input-wrapper">
                <span class="input-icon">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                        <polyline points="22,6 12,13 2,6"/>
                    </svg>
                </span>
                <input type="email" id="email" class="form-input" placeholder="exemplo@escola.com" required autocomplete="email"/>
            </div>
        </div>

        <div class="form-group">
            <label for="senha">Palavra-passe</label>
            <div class="input-wrapper">
                <span class="input-icon">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                </span>
                <input type="password" id="senha" class="form-input" placeholder="••••••••" required autocomplete="current-password"/>
            </div>
        </div>

        <div id="loginErro" class="error-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span id="mensagemErro">Credenciais inválidas. Verifique o e-mail e a palavra-passe.</span>
        </div>

        <button type="submit" id="btnLogin" class="btn-submit">
            <span>Iniciar Sessão</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"/>
                <polyline points="12 5 19 12 12 19"/>
            </svg>
        </button>
    </form>

    <div class="login-footer">
        Sistema de Avaliação & Geração de Provas
    </div>
</div>

<script>
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
        e.preventDefault();
        const erroBox = document.getElementById('loginErro');
        const erroMsg = document.getElementById('mensagemErro');
        erroBox.style.display = 'none';

        const email = document.getElementById('email').value.trim();
        const senha = document.getElementById('senha').value;
        const btn = document.getElementById('btnLogin');

        btn.disabled = true;
        btn.querySelector('span').textContent = 'A verificar...';

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, senha })
            });

            if (!res.ok) {
                const erroData = await res.json().catch(() => ({}));
                let msg = erroData.message || 'Credenciais inválidas. Verifique o e-mail e a palavra-passe.';
                if (msg.includes('lazily initialize') || msg.includes('Hibernate')) {
                    msg = 'Erro interno ao iniciar sessão. Tente novamente.';
                }
                throw new Error(msg);
            }

            const data = await res.json();
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify({
                id: data.id,
                nome: data.nome,
                email: data.email,
                role: data.role,
                atribuicoes: data.atribuicoes || []
            }));

            window.location.href = '/';
        } catch (err) {
            erroMsg.textContent = err.message;
            erroBox.style.display = 'flex';
        } finally {
            btn.disabled = false;
            btn.querySelector('span').textContent = 'Iniciar Sessão';
        }
    });

    if (localStorage.getItem('token')) {
        window.location.href = '/';
    }
</script>

</body>
</html>
