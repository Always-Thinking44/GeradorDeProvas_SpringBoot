<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login — Sistema de Geração de Provas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body.login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 100%);
            padding: 24px;
            color: #1e293b;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 16px;
            padding: 40px 36px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #4f46e5, #06b6d4, #10b981);
        }

        .login-brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-icon-wrapper {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
            color: #ffffff;
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4);
        }

        .login-brand h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
        }

        .login-brand p {
            color: #64748b;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: #94a3b8;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            font-size: 0.95rem;
            color: #0f172a;
            background: #f8fafc;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form-input::placeholder {
            color: #94a3b8;
        }

        .form-input:hover {
            border-color: #94a3b8;
            background: #ffffff;
        }

        .form-input:focus {
            background: #ffffff;
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
        }

        .error-box {
            display: none;
            align-items: flex-start;
            gap: 10px;
            background: #fef2f2;
            border: 1.5px solid #fecaca;
            color: #991b1b;
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            line-height: 1.4;
            animation: shake 0.3s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        .error-box svg {
            flex-shrink: 0;
            margin-top: 1px;
        }

        .btn-submit {
            width: 100%;
            padding: 13px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 14px -1px rgba(79, 70, 229, 0.4);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #4338ca 0%, #3730a3 100%);
            box-shadow: 0 6px 18px -1px rgba(79, 70, 229, 0.5);
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .quick-access-box {
            margin-top: 26px;
            padding-top: 22px;
            border-top: 1px dashed #e2e8f0;
        }

        .quick-access-box h4 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #64748b;
            margin-bottom: 12px;
            text-align: center;
            font-weight: 600;
        }

        .quick-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .quick-btn {
            padding: 10px 12px;
            border: 1.5px solid #e2e8f0;
            background: #f8fafc;
            border-radius: 10px;
            font-size: 0.8rem;
            color: #334155;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .quick-btn:hover {
            background: #ffffff;
            border-color: #4f46e5;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.08);
            transform: translateY(-1px);
        }

        .quick-btn .btn-role {
            font-weight: 700;
            font-size: 0.85rem;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .quick-btn.admin:hover .btn-role { color: #4f46e5; }
        .quick-btn.prof:hover .btn-role { color: #16a34a; }

        .quick-btn .btn-email {
            color: #64748b;
            font-size: 0.75rem;
        }
    </style>
</head>
<body class="login-page">

<div class="login-card">
    <div class="login-brand">
        <div class="brand-icon-wrapper">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
                <polyline points="10 9 9 9 8 9"/>
            </svg>
        </div>
        <h1>Gerador de Provas</h1>
        <p>Acesse o painel escolar com sua conta</p>
    </div>

    <form id="formLogin">
        <div class="form-group">
            <label for="email">E-mail</label>
            <div class="input-wrapper">
                <span class="input-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                        <polyline points="22,6 12,13 2,6"/>
                    </svg>
                </span>
                <input type="email" id="email" class="form-input" placeholder="seu.email@escola.com" required autocomplete="email"/>
            </div>
        </div>

        <div class="form-group">
            <label for="senha">Senha</label>
            <div class="input-wrapper">
                <span class="input-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                </span>
                <input type="password" id="senha" class="form-input" placeholder="••••••••" required autocomplete="current-password"/>
            </div>
        </div>

        <div id="loginErro" class="error-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span id="mensagemErro">Usuário ou senha incorretos.</span>
        </div>

        <button type="submit" id="btnLogin" class="btn-submit">
            <span>Entrar no Sistema</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"/>
                <polyline points="12 5 19 12 12 19"/>
            </svg>
        </button>
    </form>

    <div class="quick-access-box">
        <h4>Acesso Rápido de Teste</h4>
        <div class="quick-btns">
            <button type="button" class="quick-btn admin" onclick="preencherCredenciais('admin@escola.com', 'admin123')">
                <span class="btn-role">👑 Administrador</span>
                <span class="btn-email">admin@escola.com</span>
            </button>
            <button type="button" class="quick-btn prof" onclick="preencherCredenciais('professor@escola.com', 'prof123')">
                <span class="btn-role">👨‍🏫 Professor</span>
                <span class="btn-email">professor@escola.com</span>
            </button>
        </div>
    </div>
</div>

<script>
    function preencherCredenciais(email, senha) {
        document.getElementById('email').value = email;
        document.getElementById('senha').value = senha;
        document.getElementById('formLogin').dispatchEvent(new Event('submit'));
    }

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
        e.preventDefault();
        const erroBox = document.getElementById('loginErro');
        const erroMsg = document.getElementById('mensagemErro');
        erroBox.style.display = 'none';

        const email = document.getElementById('email').value.trim();
        const senha = document.getElementById('senha').value;
        const btn = document.getElementById('btnLogin');

        btn.disabled = true;
        btn.querySelector('span').textContent = 'Autenticando...';

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, senha })
            });

            if (!res.ok) {
                const erroData = await res.json().catch(() => ({}));
                let msg = erroData.message || 'Credenciais inválidas. Verifique seu e-mail e senha.';
                if (msg.includes('lazily initialize') || msg.includes('Hibernate')) {
                    msg = 'Erro interno de inicialização da conta. Tente novamente.';
                }
                throw new Error(msg);
            }

            const data = await res.json();
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify({
                id: data.id,
                nome: data.nome,
                email: data.email,
                role: data.role,
                atribuicoes: data.atribuicoes || []
            }));

            window.location.href = '/';
        } catch (err) {
            erroMsg.textContent = err.message;
            erroBox.style.display = 'flex';
        } finally {
            btn.disabled = false;
            btn.querySelector('span').textContent = 'Entrar no Sistema';
        }
    });

    if (localStorage.getItem('token')) {
        window.location.href = '/';
    }
</script>

</body>
</html>
