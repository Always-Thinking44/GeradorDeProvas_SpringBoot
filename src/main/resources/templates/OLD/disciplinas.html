<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">

<th:block layout:fragment="page-title">Disciplinas</th:block>
<th:block layout:fragment="breadcrumb">Cadastro › Disciplinas</th:block>

<th:block layout:fragment="content">

<div class="card">
    <div class="card-header">
        <span class="card-title">Disciplinas</span>
        <button class="btn btn-primary" onclick="abrirModalNova()">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Nova disciplina
        </button>
    </div>

    <div class="tbl-wrap">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Nome</th>
                    <th style="width:120px">Acções</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(disciplinas)}">
                    <td colspan="3" class="empty-state">Nenhuma disciplina registada. Crie a primeira.</td>
                </tr>
                <tr th:each="d : ${disciplinas}">
                    <td class="font-mono text-muted" th:text="${d.id}">1</td>
                    <td th:text="${d.nome}">Matemática</td>
                    <td>
                        <div class="actions">
                            <button class="btn btn-ghost btn-sm btn-icon"
                                    th:onclick="|abrirModalEditar(${d.id}, '${d.nome}')|"
                                    title="Editar">
                                <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                            </button>
                            <button class="btn btn-danger btn-sm btn-icon"
                                    th:onclick="|confirmarDelete(${d.id}, '${d.nome}')|"
                                    title="Eliminar">
                                <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- MODAL CRIAR / EDITAR -->
<div class="modal-backdrop" id="modal-form">
    <div class="modal">
        <div class="modal-header">
            <span class="modal-title" id="modal-title">Nova disciplina</span>
            <button class="modal-close" onclick="closeModal('modal-form')">✕</button>
        </div>
        <div class="form-group">
            <label class="form-label">Nome da disciplina</label>
            <input id="inp-nome" class="form-control" type="text" placeholder="Ex: Matemática" maxlength="100"/>
        </div>
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px">
            <button class="btn btn-ghost" onclick="closeModal('modal-form')">Cancelar</button>
            <button class="btn btn-primary" id="btn-salvar" onclick="salvar()">Guardar</button>
        </div>
    </div>
</div>

<!-- MODAL CONFIRMAR DELETE -->
<div class="modal-backdrop" id="modal-delete">
    <div class="modal" style="max-width:400px">
        <div class="modal-header">
            <span class="modal-title">Eliminar disciplina</span>
            <button class="modal-close" onclick="closeModal('modal-delete')">✕</button>
        </div>
        <p style="color:var(--muted);font-size:14px;margin-bottom:20px">
            Tem a certeza que quer eliminar <strong id="del-nome" style="color:var(--text)"></strong>?
            Esta acção é irreversível.
        </p>
        <div style="display:flex;gap:10px;justify-content:flex-end">
            <button class="btn btn-ghost" onclick="closeModal('modal-delete')">Cancelar</button>
            <button class="btn btn-danger" onclick="deletar()">Eliminar</button>
        </div>
    </div>
</div>

</th:block>

<th:block layout:fragment="scripts">
<script>
    let editId = null;

    function abrirModalNova() {
        editId = null;
        document.getElementById('modal-title').textContent = 'Nova disciplina';
        document.getElementById('inp-nome').value = '';
        openModal('modal-form');
        setTimeout(() => document.getElementById('inp-nome').focus(), 100);
    }

    function abrirModalEditar(id, nome) {
        editId = id;
        document.getElementById('modal-title').textContent = 'Editar disciplina';
        document.getElementById('inp-nome').value = nome;
        openModal('modal-form');
    }

    async function salvar() {
        const nome = document.getElementById('inp-nome').value.trim();
        if (!nome) { showToast('Informe o nome da disciplina.', 'error'); return; }

        const btn = document.getElementById('btn-salvar');
        btn.disabled = true;

        try {
            const url    = editId ? `/disciplinas/${editId}` : '/disciplinas';
            const method = editId ? 'PUT' : 'POST';
            const res = await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome })
            });
            if (!res.ok) {
                const err = await res.text();
                throw new Error(err || 'Erro ao guardar.');
            }
            closeModal('modal-form');
            showToast(editId ? 'Disciplina actualizada.' : 'Disciplina criada.');
            setTimeout(() => location.reload(), 800);
        } catch (e) {
            showToast(e.message, 'error');
        } finally {
            btn.disabled = false;
        }
    }

    let deleteId = null;
    function confirmarDelete(id, nome) {
        deleteId = id;
        document.getElementById('del-nome').textContent = nome;
        openModal('modal-delete');
    }

    async function deletar() {
        try {
            const res = await fetch(`/disciplinas/${deleteId}`, { method: 'DELETE' });
            if (!res.ok) throw new Error('Erro ao eliminar.');
            closeModal('modal-delete');
            showToast('Disciplina eliminada.');
            setTimeout(() => location.reload(), 800);
        } catch (e) {
            showToast(e.message, 'error');
        }
    }

    document.getElementById('inp-nome').addEventListener('keydown', e => {
        if (e.key === 'Enter') salvar();
    });
</script>
</th:block>
</html>
