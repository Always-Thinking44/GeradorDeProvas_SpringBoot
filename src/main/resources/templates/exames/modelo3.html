<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:text="'Prova — ' + ${disciplinaNome}">Prova</title>
  <style>
    @page { size: A4; margin: 1.1cm 1.3cm; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, Helvetica, sans-serif; font-size: 10.5pt; color: #111827; line-height: 1.4; }

    .toolbar { position: fixed; top: 0; left: 0; right: 0; background: #111827; padding: 8px 16px; z-index: 50; }
    .toolbar a, .toolbar button { display: inline-block; margin-right: 6px; padding: 6px 12px; background: #1f2937; color: #e5e7eb; text-decoration: none; border: 1px solid #374151; font-family: Arial, sans-serif; font-size: 12px; cursor: pointer; }
    .toolbar a:hover, .toolbar button:hover { background: #374151; color: #fff; }
    @media print { .toolbar { display: none; } }

    body.sheet-body { padding-top: 48px; }
    @media print { body.sheet-body { padding-top: 0; } }

    .sheet { max-width: 820px; margin: 0 auto; }

    .cabecalho { border-bottom: 1px solid #111827; padding-bottom: 6px; margin-bottom: 10px; }
    .cabecalho h1 { font-size: 14pt; display: inline; }
    .cabecalho .sub { font-size: 9.5pt; color: #4b5563; margin-top: 2px; }
    table.campos { width: 100%; margin-top: 8px; font-size: 9.5pt; border-collapse: collapse; }
    table.campos td { padding: 2px 4px; }

    .instrucoes { font-size: 9pt; color: #4b5563; margin-bottom: 10px; }

    .questao { margin-bottom: 12px; border-bottom: 1px solid #e5e7eb; padding-bottom: 8px; }
    .q-cabecalho { margin-bottom: 2px; }
    .q-num { font-weight: bold; margin-right: 4px; }
    .q-info { font-size: 8.5pt; color: #6b7280; margin-bottom: 4px; }

    ul.alternativas { list-style: none; padding-left: 18px; }
    ul.alternativas li { margin: 1px 0; }
    ul.alternativas li.correta { color: #166534; font-weight: bold; }
    .letra { font-weight: bold; margin-right: 4px; }
    .check { color: #166534; font-weight: bold; margin-left: 6px; }

    .resposta-bloco { padding-left: 18px; margin: 3px 0; }
    .resposta-label { font-weight: bold; }
    .linha { display: inline-block; width: 200px; border-bottom: 1px dotted #6b7280; }
    .espaco { height: 50px; border-bottom: 1px solid #e5e7eb; margin: 4px 0 0 18px; }
    .gabarito-resposta { padding-left: 18px; margin: 3px 0; color: #166534; font-weight: bold; }

    .rodape { margin-top: 16px; font-size: 8.5pt; color: #6b7280; text-align: center; }
  </style>
</head>
<body class="sheet-body">

  <div class="toolbar" th:if="${!forPdf}">
    <a href="/provas">← Voltar</a>
    <a th:href="${mostrarGabarito ? ('/provas/' + prova.id) : ('/provas/' + prova.id + '/gabarito')}"
       th:text="${mostrarGabarito ? 'Ver prova' : 'Ver gabarito'}">Ver gabarito</a>
    <a th:href="'/api/prova_gerada/' + ${prova.id} + '/pdf'">PDF da prova</a>
    <a th:href="'/api/prova_gerada/' + ${prova.id} + '/gabarito/pdf'">PDF do gabarito</a>
    <button type="button" onclick="window.print()">Imprimir</button>
  </div>

  <div class="sheet">
    <div class="cabecalho">
      <h1 th:text="'Prova de ' + ${disciplinaNome}">Prova</h1>
      <span th:if="${!forPdf}" th:text="' · ' + ${dataLabel}"></span>
      <div class="sub">
        Classe <strong th:text="${classeNome}"></strong>
        <span> · </span>
        <span th:text="${trimestreLabel}"></span>
        <span> · </span>
        <span th:text="${templateLabel}"></span>
        <span> · </span>
        Total: <strong th:text="${totalPontos} + ' pontos'"></strong>
      </div>
      <table class="campos">
        <tr>
          <td>Nome: <span style="border-bottom:1px solid #111827;display:inline-block;width:260px">&#160;</span></td>
          <td>Nº: <span style="border-bottom:1px solid #111827;display:inline-block;width:60px">&#160;</span></td>
          <td>Data: <span style="border-bottom:1px solid #111827;display:inline-block;width:100px">&#160;</span></td>
        </tr>
      </table>
    </div>

    <p class="instrucoes">Responda a todas as questões. Boa sorte!</p>

    <div class="questoes">
      <div class="questao" th:each="q, st : ${perguntas}">
        <div class="q-cabecalho">
          <span class="q-num" th:text="${st.index + 1} + '.'"></span>
          <span th:text="${q.enunciado}"></span>
        </div>
        <div class="q-info">
          <span th:text="${q.tipoLabel}"></span>
          <span th:if="${q.tema != null}" th:text="' · ' + ${q.tema}"></span>
          <span th:if="${q.pontuacao != null}" th:text="' · ' + ${q.pontuacao} + ' pts'"></span>
        </div>

        <th:block th:if="${#strings.equals(q.tipoPergunta, 'ESCOLHA_MULTIPLA') or #strings.equals(q.tipoPergunta, 'VERDADEIRO_FALSO')}">
          <ul class="alternativas">
            <li th:each="r, rs : ${q.respostas}" th:classappend="${mostrarGabarito and r.correta} ? 'correta'">
              <span class="letra" th:text="${r.letra} + ')'"></span>
              <span th:text="${r.descricao}"></span>
              <span class="check" th:if="${mostrarGabarito and r.correta}" th:text="'✔ CORRETA'"></span>
            </li>
          </ul>
        </th:block>

        <div th:if="${!mostrarGabarito and #strings.equals(q.tipoPergunta, 'COMPLETAR')}" class="resposta-bloco">
          <span class="resposta-label">Resposta:</span> <span class="linha">&#160;</span>
        </div>
        <div th:if="${!mostrarGabarito and #strings.equals(q.tipoPergunta, 'DESENVOLVIMENTO')}" class="resposta-bloco">
          <span class="resposta-label">Resposta:</span>
          <div class="espaco"></div>
        </div>
        <th:block th:if="${mostrarGabarito and #strings.equals(q.tipoPergunta, 'COMPLETAR')}">
          <div class="gabarito-resposta">
            Resposta correta: <strong th:text="${#lists.isEmpty(q.respostas) ? '' : q.respostas[0].descricao}"></strong>
          </div>
        </th:block>
        <th:block th:if="${mostrarGabarito and #strings.equals(q.tipoPergunta, 'DESENVOLVIMENTO')}">
          <div class="gabarito-resposta">Resposta discursiva — correção manual.</div>
        </th:block>
      </div>
    </div>

    <div class="rodape">
      <span th:if="${mostrarGabarito}">GABARITO · </span>
      <span>Total: </span>
      <span th:text="${totalPontos} + ' pontos'"></span>
    </div>
  </div>

</body>
</html>
