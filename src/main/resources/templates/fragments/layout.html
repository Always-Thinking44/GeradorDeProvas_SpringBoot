<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Fragmento reaproveitável: sidebar + topbar + modal "Nova Classe" -->
</head>
<body>

<!-- ============================================================
     SIDEBAR
     ============================================================ -->
<aside class="sidebar" th:fragment="sidebar">
    <div class="sidebar__brand">
        <span class="brand-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
                <polyline points="10 9 9 9 8 9"/>
            </svg>
        </span>
        <span class="dot"></span> Gerador de Provas
    </div>

    <nav>
        <div class="sidebar__section-title">Geral</div>
        <a class="nav-link" th:classappend="${activePage == 'dashboard'} ? 'active'"
           href="/">
            <span class="icon">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
            </span> Dashboard
        </a>

        <div class="sidebar__section-title">Classes</div>
        <ul id="classesList">
            <!-- preenchido dinamicamente via JS (carregarSidebarClasses) -->
            <li data-empty style="padding:8px 12px;color:var(--text-on-dark-muted);font-size:.8rem">Carregando...</li>
        </ul>
        <button type="button" class="sidebar__new-class-btn" onclick="openModal('modalNovaClasse')">
            <span>＋</span> Nova classe
        </button>

        <div class="sidebar__section-title">Outros</div>
        <a class="nav-link" th:classappend="${activePage == 'disciplinas'} ? 'active'"
           href="/disciplinas">
            <span class="icon">
                <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            </span> Disciplinas
        </a>
        <a class="nav-link" th:classappend="${activePage == 'temas'} ? 'active'"
           href="/temas">
            <span class="icon">
                <svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
            </span> Temas
        </a>
        <a class="nav-link" th:classappend="${activePage == 'perguntas'} ? 'active'"
           href="/perguntas">
            <span class="icon">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            </span> Perguntas
        </a>
        <a class="nav-link" th:classappend="${activePage == 'modelos'} ? 'active'"
           href="/modelos">
            <span class="icon">
                <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            </span> Modelos de prova
        </a>
        <a class="nav-link" th:classappend="${activePage == 'provas'} ? 'active'"
           href="/provas">
            <span class="icon">
                <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            </span> Provas geradas
        </a>
    </nav>
</aside>

<!-- ============================================================
     TOPBAR
     ============================================================ -->
<header class="topbar" th:fragment="topbar(titulo, subtitulo)">
    <div>
        <button id="mobileMenuBtn" class="btn btn-outline btn-sm" style="display:none">☰</button>
        <h1 th:text="${titulo}">Título</h1>
        <div class="subtitle" th:text="${subtitulo}">Subtítulo</div>
    </div>
</header>

<!-- ============================================================
     MODAL: Nova Classe (global, disponível em qualquer página)
     ============================================================ -->
<div th:fragment="modalNovaClasse" class="modal-overlay" id="modalNovaClasse">
    <div class="modal">
        <div class="modal__header">
            <h3>Nova classe</h3>
            <button class="modal__close" onclick="closeModal('modalNovaClasse')">&times;</button>
        </div>
        <form id="formNovaClasse">
            <div class="modal__body">
                <div class="form-group">
                    <label for="novaClasseNome">Nome da classe</label>
                    <input type="text" id="novaClasseNome" name="nome" placeholder="Ex: 10ª Classe" autocomplete="off" required>
                    <div class="form-error" id="novaClasseErro"></div>
                </div>
            </div>
            <div class="modal__footer">
                <button type="button" class="btn btn-outline" onclick="closeModal('modalNovaClasse')">Cancelar</button>
                <button type="submit" class="btn btn-primary">Cadastrar classe</button>
            </div>
        </form>
    </div>
</div>

<!-- ============================================================
     TOAST CONTAINER
     ============================================================ -->
<div th:fragment="toastContainer" id="toastContainer"></div>

<!-- ============================================================
     SCRIPTS COMUNS
     ============================================================ -->
<th:block th:fragment="scriptsComuns">
    <script th:src="@{/js/api.js}"></script>
</th:block>

</body>
</html>
