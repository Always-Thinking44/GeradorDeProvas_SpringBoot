<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="page(content)">
<head>
    <meta charset="UTF-8">
    <title>Gerador de Provas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 flex h-screen overflow-hidden">

    <aside class="w-64 bg-slate-800 text-white flex flex-col justify-between shadow-lg">
        <div>
            <div class="p-5 text-xl font-bold tracking-wider border-b border-slate-700 flex items-center justify-between">
                <span>📝 ProvaGen</span>
            </div>
            <nav class="mt-6 px-3 space-y-1">
                <a href="/static" th:class="${activePage == 'dashboard' ? 'flex items-center px-4 py-3 bg-slate-900 rounded-lg text-sm font-medium' : 'flex items-center px-4 py-3 text-slate-300 hover:bg-slate-700 hover:text-white rounded-lg text-sm font-medium transition-colors'}">
                    📊 Dashboard
                </a>
                
                <div class="pt-4 px-4 text-xs font-semibold text-slate-400 uppercase tracking-wider">
                    Turmas / Classes
                </div>
                <div class="space-y-1 mt-2">
                    <th:block th:each="c : ${classesGlobal != null ? classesGlobal : classes}">
                        <a th:href="@{/classes/{id}(id=${c.id})}" 
                           class="flex items-center px-4 py-2 text-sm text-slate-300 hover:bg-slate-700 hover:text-white rounded-lg transition-colors">
                            🏫 <span class="ml-2" th:text="${c.nome}">Classe</span>
                        </a>
                    </th:block>
                </div>
            </nav>
        </div>
        
        <div class="p-4 border-t border-slate-700">
            <button onclick="openModal('modal-classe-global')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg text-sm transition-colors shadow">
                + Nova Classe
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-y-auto">
        <header class="bg-white border-b border-gray-200 py-4 px-8 flex justify-between items-center shadow-sm">
            <h1 class="text-xl font-semibold text-gray-800 capitalize" th:text="${activePage}">Página</h1>
            <div class="flex items-center space-x-4">
                <span class="text-sm bg-slate-100 text-slate-700 px-3 py-1 rounded-full font-medium">Painel Académico</span>
            </div>
        </header>
        
        <div class="p-8">
            <th:block th:replace="${content}"></th:block>
        </div>
    </main>

    <div id="modal-classe-global" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden items-center justify-center z-50 animate-fade-in">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6 transform transition-all">
            <div class="flex justify-between items-center pb-3 border-b border-gray-200">
                <h3 class="text-lg font-semibold text-gray-900">Cadastrar Nova Classe</h3>
                <button onclick="closeModal('modal-classe-global')" class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
            </div>
            <form th:action="@{/api/classe}" method="POST" class="mt-4 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nome da Classe/Turma</label>
                    <input type="text" name="nome" required placeholder="Ex: 10ª Classe A" class="w-full border border-gray-300 px-3 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="bg-yellow-50 border-l-4 border-yellow-400 p-3 rounded text-xs text-yellow-700">
                    ⚠️ Nota: Após cadastrar a classe, lembre-se de associar suas respectivas disciplinas.
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeModal('modal-classe-global')" class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg text-sm hover:bg-gray-50">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700 shadow shadow-indigo-200">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function openModal(id) {
            const modal = document.getElementById(id);
            if (modal) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            }
        }
        function closeModal(id) {
            const modal = document.getElementById(id);
            if (modal) {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
