<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="pt">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title layout:title-pattern="$CONTENT_TITLE | GeradorProvas">GeradorProvas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --navy:   #0f1b2d;
            --navy2:  #162236;
            --navy3:  #1e3050;
            --blue:   #2563eb;
            --blue-l: #3b82f6;
            --cyan:   #06b6d4;
            --text:   #e2e8f0;
            --muted:  #94a3b8;
            --border: #1e3050;
            --card:   #162236;
            --danger: #ef4444;
            --success:#10b981;
            --warn:   #f59e0b;
            --radius: 10px;
            --sidebar-w: 220px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--navy);
            color: var(--text);
            display: flex;
            min-height: 100vh;
        }

        /* ── SIDEBAR ── */
        .sidebar {
            width: var(--sidebar-w);
            background: var(--navy2);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0; left: 0; bottom: 0;
            z-index: 100;
        }
        .sidebar-logo {
            padding: 24px 20px 20px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-logo span {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 600;
            color: var(--cyan);
            letter-spacing: 0.5px;
        }
        .sidebar-logo .logo-sub {
            display: block;
            font-family: 'Inter', sans-serif;
            font-size: 10px;
            color: var(--muted);
            font-weight: 400;
            margin-top: 2px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .sidebar-nav {
            padding: 16px 12px;
            flex: 1;
            overflow-y: auto;
        }
        .nav-section {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--muted);
            padding: 12px 8px 6px;
        }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 10px;
            border-radius: 7px;
            text-decoration: none;
            color: var(--muted);
            font-size: 13.5px;
            font-weight: 500;
            transition: background 0.15s, color 0.15s;
            margin-bottom: 2px;
        }
        .nav-link:hover { background: var(--navy3); color: var(--text); }
        .nav-link.active { background: var(--blue); color: #fff; }
        .nav-link svg { flex-shrink: 0; }

        /* ── MAIN ── */
        .main {
            margin-left: var(--sidebar-w);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .topbar {
            height: 56px;
            background: var(--navy2);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 28px;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .topbar h1 {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            flex: 1;
        }
        .topbar .breadcrumb {
            font-size: 12px;
            color: var(--muted);
        }
        .page-body {
            padding: 28px;
            flex: 1;
        }

        /* ── CARDS ── */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
        }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }
        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        /* ── TABLE ── */
        .tbl-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
        thead th {
            text-align: left;
            padding: 10px 14px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
        }
        tbody tr { border-bottom: 1px solid var(--border); transition: background 0.12s; }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: rgba(255,255,255,0.03); }
        tbody td { padding: 12px 14px; color: var(--text); }

        /* ── BUTTONS ── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 7px;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
            text-decoration: none;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--blue); color: #fff; }
        .btn-primary:hover { background: var(--blue-l); }
        .btn-danger  { background: var(--danger); color: #fff; }
        .btn-danger:hover { opacity: 0.85; }
        .btn-ghost   { background: transparent; color: var(--muted); border: 1px solid var(--border); }
        .btn-ghost:hover { color: var(--text); border-color: var(--muted); }
        .btn-sm { padding: 5px 10px; font-size: 12px; }
        .btn-icon { padding: 6px; border-radius: 6px; }

        /* ── MODAL ── */
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(3px);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        .modal-backdrop.open { display: flex; }
        .modal {
            background: var(--navy2);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 100%;
            max-width: 540px;
            max-height: 88vh;
            overflow-y: auto;
            padding: 28px;
            animation: slideUp 0.2s ease;
        }
        .modal-lg { max-width: 720px; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }
        .modal-title { font-size: 16px; font-weight: 700; }
        .modal-close {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
        }
        .modal-close:hover { color: var(--text); }

        /* ── FORMS ── */
        .form-group { margin-bottom: 16px; }
        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-control {
            width: 100%;
            background: var(--navy);
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 10px 12px;
            font-size: 14px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            transition: border-color 0.15s;
        }
        .form-control:focus { outline: none; border-color: var(--blue); }
        .form-control option { background: var(--navy2); }
        textarea.form-control { resize: vertical; min-height: 90px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }

        /* ── BADGE ── */
        .badge {
            display: inline-block;
            padding: 3px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-blue  { background: rgba(37,99,235,0.2); color: var(--blue-l); }
        .badge-cyan  { background: rgba(6,182,212,0.15); color: var(--cyan); }
        .badge-green { background: rgba(16,185,129,0.15); color: var(--success); }
        .badge-warn  { background: rgba(245,158,11,0.15); color: var(--warn); }
        .badge-red   { background: rgba(239,68,68,0.15); color: var(--danger); }

        /* ── TOAST ── */
        #toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 13.5px;
            font-weight: 500;
            z-index: 9999;
            display: none;
            animation: fadeIn 0.2s ease;
        }
        #toast.success { background: var(--success); color: #fff; }
        #toast.error   { background: var(--danger);  color: #fff; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; } }

        /* ── MISC ── */
        .empty-state {
            text-align: center;
            padding: 48px;
            color: var(--muted);
            font-size: 14px;
        }
        .divider { border: none; border-top: 1px solid var(--border); margin: 18px 0; }
        .actions { display: flex; gap: 6px; }
        .text-muted { color: var(--muted); }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
    <th:block layout:fragment="head-extra"></th:block>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
    <div class="sidebar-logo">
        <span>GP/</span>
        <span class="logo-sub">Gerador de Provas</span>
    </div>
    <nav class="sidebar-nav">
        <div class="nav-section">Principal</div>
        <a th:href="@{/}" class="nav-link" th:classappend="${activePage == 'dashboard'} ? 'active'">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            Dashboard
        </a>

        <div class="nav-section">Cadastro</div>
        <a th:href="@{/classes}" class="nav-link" th:classappend="${activePage == 'classes'} ? 'active'">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Turmas
        </a>
        <a th:href="@{/disciplinas}" class="nav-link" th:classappend="${activePage == 'disciplinas'} ? 'active'">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            Disciplinas
        </a>
        <a th:href="@{/temas}" class="nav-link" th:classappend="${activePage == 'temas'} ? 'active'">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
            Temas
        </a>
        <a th:href="@{/perguntas}" class="nav-link" th:classappend="${activePage == 'perguntas'} ? 'active'">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            Perguntas
        </a>

        <div class="nav-section">Provas</div>
        <a th:href="@{/modelos}" class="nav-link" th:classappend="${activePage == 'modelos'} ? 'active'">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            Modelos
        </a>
        <a th:href="@{/provas}" class="nav-link" th:classappend="${activePage == 'provas'} ? 'active'">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            Provas Geradas
        </a>
    </nav>
</aside>

<!-- MAIN -->
<main class="main">
    <div class="topbar">
        <h1 layout:fragment="page-title">Dashboard</h1>
        <span class="breadcrumb" layout:fragment="breadcrumb"></span>
    </div>
    <div class="page-body">
        <th:block layout:fragment="content"></th:block>
    </div>
</main>

<!-- TOAST -->
<div id="toast"></div>

<script>
    function showToast(msg, type = 'success') {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = type;
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    }
    function openModal(id) { document.getElementById(id).classList.add('open'); }
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }
    document.querySelectorAll('.modal-backdrop').forEach(m => {
        m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); });
    });
</script>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
