<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Classes · Gerador de Provas</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/layout :: sidebar}"></div>

<div class="main">
    <div th:replace="~{fragments/layout :: topbar('Classes', 'Gerencie as turmas cadastradas no sistema')}"></div>

    <div class="content">
        <div class="card">
            <div class="card__header">
                <h2>Classes cadastradas</h2>
                <button class="btn btn-primary btn-sm" onclick="openModal('modalNovaClasse')">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Nova classe
                </button>
            </div>

            <div class="table-wrap">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Ações</th>
                    </tr>
                    </thead>
                    <tbody id="classesTableBody">
                    <tr th:each="c : ${classes}">
                        <td>
                            <a th:href="@{/classes/{id}(id=${c.id})}" style="font-weight:600;text-decoration:none;color:var(--primary)">
                                <span th:text="${c.nome}">Classe</span>
                            </a>
                        </td>
                        <td>
                            <a class="btn btn-outline btn-sm" th:href="@{/classes/{id}(id=${c.id})}">Abrir</a>
                            <button class="btn btn-danger-ghost btn-sm" th:attr="data-id=${c.id}, data-nome=${c.nome}" onclick="removerClasse(this.dataset.id, this.dataset.nome)">Excluir</button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div id="classesEmpty" class="empty-state" th:if="${#lists.isEmpty(classes)}">
                <div class="emoji">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-muted)"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                </div>
                Nenhuma classe cadastrada ainda.
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: modalNovaClasse}"></div>
<div th:replace="~{fragments/layout :: toastContainer}"></div>
<div th:replace="~{fragments/layout :: scriptsComuns}"></div>
<script th:src="@{/js/classes.js}"></script>

</body>
</html>
