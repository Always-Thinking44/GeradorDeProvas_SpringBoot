<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::section})}">
<body>
<section>
    <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6 mb-8">
        <div class="bg-white p-6 rounded-xl border border-gray-100 shadow-sm flex items-center space-x-4">
            <div class="p-3 bg-blue-50 text-blue-600 rounded-lg text-2xl">🏫</div>
            <div>
                <p class="text-sm text-gray-500 font-medium">Classes</p>
                <h3 class="text-2xl font-bold text-gray-800" th:text="${totalClasses}">0</h3>
            </div>
        </div>
        <div class="bg-white p-6 rounded-xl border border-gray-100 shadow-sm flex items-center space-x-4">
            <div class="p-3 bg-emerald-50 text-emerald-600 rounded-lg text-2xl">📚</div>
            <div>
                <p class="text-sm text-gray-500 font-medium">Disciplinas</p>
                <h3 class="text-2xl font-bold text-gray-800" th:text="${totalDisciplinas}">0</h3>
            </div>
        </div>
        <div class="bg-white p-6 rounded-xl border border-gray-100 shadow-sm flex items-center space-x-4">
            <div class="p-3 bg-purple-50 text-purple-600 rounded-lg text-2xl">❓</div>
            <div>
                <p class="text-sm text-gray-500 font-medium">Perguntas</p>
                <h3 class="text-2xl font-bold text-gray-800" th:text="${totalPerguntas}">0</h3>
            </div>
        </div>
        <div class="bg-white p-6 rounded-xl border border-gray-100 shadow-sm flex items-center space-x-4">
            <div class="p-3 bg-amber-50 text-amber-600 rounded-lg text-2xl">📄</div>
            <div>
                <p class="text-sm text-gray-500 font-medium">Provas Geradas</p>
                <h3 class="text-2xl font-bold text-gray-800" th:text="${totalProvas}">0</h3>
            </div>
        </div>
    </div>

    <div class="bg-white p-6 rounded-xl border border-gray-100 shadow-sm">
        <h2 class="text-lg font-semibold text-gray-800 mb-4">Ações Rápidas</h2>
        <div class="flex flex-wrap gap-4">
            <button onclick="openModal('modal-classe-global')" class="px-5 py-3 bg-slate-800 text-white font-medium rounded-lg hover:bg-slate-700 transition shadow">
                + Nova Classe
            </button>
            <button onclick="openModal('modal-disciplina-dash')" class="px-5 py-3 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 transition shadow">
                + Cadastrar Disciplina
            </button>
        </div>
    </div>

    <div id="modal-disciplina-dash" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6">
            <div class="flex justify-between items-center pb-3 border-b border-gray-200">
                <h3 class="text-lg font-semibold text-gray-900">Nova Disciplina</h3>
                <button onclick="closeModal('modal-disciplina-dash')" class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
            </div>
            <form th:action="@{/api/disciplinas}" method="POST" class="mt-4 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nome da Disciplina</label>
                    <input type="text" name="nome" required class="w-full border border-gray-300 px-3 py-2 rounded-lg focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Vincular à Classe</label>
                    <select name="classeId" required class="w-full border border-gray-300 px-3 py-2 rounded-lg bg-white">
                        <option value="" disabled selected>Selecione a Classe...</option>
                        <option th:each="c : ${classes}" th:value="${c.id}" th:text="${c.nome}"></option>
                    </select>
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeModal('modal-disciplina-dash')" class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg text-sm hover:bg-gray-50">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700">Vincular e Guardar</button>
                </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>
