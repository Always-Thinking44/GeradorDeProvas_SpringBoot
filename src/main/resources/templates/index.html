<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">

<th:block layout:fragment="page-title">Dashboard</th:block>

<th:block layout:fragment="content">
    <link rel="stylesheet" href="index.css">


<!-- Stats -->
<div class="stats-grid">
    <div class="stat-card c1">
        <div class="stat-label">Turmas</div>
        <div class="stat-value" th:text="${totalClasses}">0</div>
        <div class="stat-sub">registadas</div>
    </div>
    <div class="stat-card c2">
        <div class="stat-label">Disciplinas</div>
        <div class="stat-value" th:text="${totalDisciplinas}">0</div>
        <div class="stat-sub">activas</div>
    </div>
    <div class="stat-card c3">
        <div class="stat-label">Temas</div>
        <div class="stat-value" th:text="${totalTemas}">0</div>
        <div class="stat-sub">catalogados</div>
    </div>
    <div class="stat-card c4">
        <div class="stat-label">Perguntas</div>
        <div class="stat-value" th:text="${totalPerguntas}">0</div>
        <div class="stat-sub">no banco</div>
    </div>
    <div class="stat-card c5">
        <div class="stat-label">Modelos</div>
        <div class="stat-value" th:text="${totalModelos}">0</div>
        <div class="stat-sub">de prova</div>
    </div>
    <div class="stat-card c6">
        <div class="stat-label">Provas</div>
        <div class="stat-value" th:text="${totalProvas}">0</div>
        <div class="stat-sub">geradas</div>
    </div>
</div>

<!-- Acesso rápido -->
<div class="card" style="margin-bottom: 16px;">
    <div class="card-header"><span class="card-title">Acesso rápido</span></div>
    <div class="quick-grid">
        <a th:href="@{/perguntas}" class="quick-link">
            <div class="quick-icon" style="background:rgba(37,99,235,0.15)">
                <svg width="18" height="18" fill="none" stroke="#3b82f6" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            </div>
            Adicionar pergunta
        </a>
        <a th:href="@{/modelos}" class="quick-link">
            <div class="quick-icon" style="background:rgba(6,182,212,0.15)">
                <svg width="18" height="18" fill="none" stroke="#06b6d4" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            </div>
            Criar modelo de prova
        </a>
        <a th:href="@{/provas}" class="quick-link">
            <div class="quick-icon" style="background:rgba(16,185,129,0.15)">
                <svg width="18" height="18" fill="none" stroke="#10b981" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            </div>
            Gerar prova
        </a>
        <a th:href="@{/disciplinas}" class="quick-link">
            <div class="quick-icon" style="background:rgba(245,158,11,0.15)">
                <svg width="18" height="18" fill="none" stroke="#f59e0b" stroke-width="2" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            </div>
            Gerir disciplinas
        </a>
    </div>
</div>

</th:block>
</html>
