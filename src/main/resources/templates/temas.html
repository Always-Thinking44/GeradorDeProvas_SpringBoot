<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">

<th:block layout:fragment="page-title">Temas</th:block>
<th:block layout:fragment="breadcrumb">Cadastro › Temas</th:block>

<th:block layout:fragment="content">

<div class="card">
    <div class="card-header">
        <span class="card-title">Temas</span>
        <button class="btn btn-primary" onclick="abrirModalNova()">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Novo tema
        </button>
    </div>

    <div class="tbl-wrap">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Tema</th>
                    <th>Disciplina</th>
                    <th style="width:120px">Acções</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(temas)}">
                    <td colspan="4" class="empty-state">Nenhum tema registado. Crie o primeiro.</td>
                </tr>
                <tr th:each="t : ${temas}">
                    <td class="font-mono text-muted" th:text="${t.id}">1</td>
                    <td th:text="${t.nome}">Funções</td>
                    <td>
                        <span class="badge badge-blue" th:text="${t.disciplina?.nome}">Matemática</span>
                    </td>
                    <td>
                        <div class="actions">
                            <button class="btn btn-ghost btn-sm btn-icon"
                                    th:onclick="|abrirModalEditar(${t.id}, '${t.nome}', ${t.disciplina?.id})|"
                                    title="Editar">
                                <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                            </button>
                            <button class="btn btn-danger btn-sm btn-icon"
                                    th:onclick="|confirmarDelete(${t.id}, '${t.nome}')|"
                                    title="Eliminar">
                                <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- MODAL CRIAR / EDITAR -->
<div class="modal-backdrop" id="modal-form">
    <div class="modal">
        <div class="modal-header">
            <span class="modal-title" id="modal-title">Novo tema</span>
            <button class="modal-close" onclick="closeModal('modal-form')">✕</button>
        </div>
        <div class="form-group">
            <label class="form-label">Nome do tema</label>
            <input id="inp-nome" class="form-control" type="text" placeholder="Ex: Funções Quadráticas"/>
        </div>
        <div class="form-group">
            <label class="form-label">Disciplina</label>
            <select id="inp-disciplina" class="form-control">
                <option value="">Seleccione uma disciplina...</option>
                <option th:each="d : ${disciplinas}"
                        th:value="${d.id}"
                        th:text="${d.nome}">Matemática</option>
            </select>
        </div>
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px">
            <button class="btn btn-ghost" onclick="closeModal('modal-form')">Cancelar</button>
            <button class="btn btn-primary" id="btn-salvar" onclick="salvar()">Guardar</button>
        </div>
    </div>
</div>

<!-- MODAL CONFIRMAR DELETE -->
<div class="modal-backdrop" id="modal-delete">
    <div class="modal" style="max-width:400px">
        <div class="modal-header">
            <span class="modal-title">Eliminar tema</span>
            <button class="modal-close" onclick="closeModal('modal-delete')">✕</button>
        </div>
        <p style="color:var(--muted);font-size:14px;margin-bottom:20px">
            Tem a certeza que quer eliminar o tema <strong id="del-nome" style="color:var(--text)"></strong>?
        </p>
        <div style="display:flex;gap:10px;justify-content:flex-end">
            <button class="btn btn-ghost" onclick="closeModal('modal-delete')">Cancelar</button>
            <button class="btn btn-danger" onclick="deletar()">Eliminar</button>
        </div>
    </div>
</div>

</th:block>

<th:block layout:fragment="scripts">
<script>
    let editId = null;

    function abrirModalNova() {
        editId = null;
        document.getElementById('modal-title').textContent = 'Novo tema';
        document.getElementById('inp-nome').value = '';
        document.getElementById('inp-disciplina').value = '';
        openModal('modal-form');
    }

    function abrirModalEditar(id, nome, disciplinaId) {
        editId = id;
        document.getElementById('modal-title').textContent = 'Editar tema';
        document.getElementById('inp-nome').value = nome;
        document.getElementById('inp-disciplina').value = disciplinaId || '';
        openModal('modal-form');
    }

    async function salvar() {
        const nome         = document.getElementById('inp-nome').value.trim();
        const disciplinaId = document.getElementById('inp-disciplina').value;

        if (!nome)         { showToast('Informe o nome do tema.', 'error'); return; }
        if (!disciplinaId) { showToast('Seleccione uma disciplina.', 'error'); return; }

        const btn = document.getElementById('btn-salvar');
        btn.disabled = true;

        try {
            const payload = { nome, disciplina: { id: parseInt(disciplinaId) } };
            const url    = editId ? `/temas/${editId}` : '/temas';
            const method = editId ? 'PUT' : 'POST';

            const res = await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!res.ok) {
                const err = await res.text();
                throw new Error(err || 'Erro ao guardar.');
            }
            closeModal('modal-form');
            showToast(editId ? 'Tema actualizado.' : 'Tema criado.');
            setTimeout(() => location.reload(), 800);
        } catch (e) {
            showToast(e.message, 'error');
        } finally {
            btn.disabled = false;
        }
    }

    let deleteId = null;
    function confirmarDelete(id, nome) {
        deleteId = id;
        document.getElementById('del-nome').textContent = nome;
        openModal('modal-delete');
    }

    async function deletar() {
        try {
            const res = await fetch(`/temas/${deleteId}`, { method: 'DELETE' });
            if (!res.ok) throw new Error('Erro ao eliminar.');
            closeModal('modal-delete');
            showToast('Tema eliminado.');
            setTimeout(() => location.reload(), 800);
        } catch (e) {
            showToast(e.message, 'error');
        }
    }
</script>
</th:block>
</html>
